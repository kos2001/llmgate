[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmgate"
version = "0.1.0"
description = "OpenRouter-style gateway for self-hosted LLM engines (vLLM, Ollama, TGI, ...): model registry, API keys, routing and token usage tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openai>=1.0"]

[project.scripts]
llmgate = "llmgate.main:run"
mockvllm = "mockvllm.server:run"
mockoidc = "mockoidc.server:run"

[tool.setuptools.packages.find]
include = ["llmgate*", "mockvllm*", "mockoidc*"]

[tool.setuptools.package-data]
llmgate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
