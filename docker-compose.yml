# NOTE: not built or run while writing this (no Docker in the development environment).
services:
  llmgate:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    volumes: ["llmgate-data:/data"]
    depends_on: [vllm]

  # Real engine; add a provider with base_url http://vllm:8000/v1 in the dashboard.
  vllm:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-7B-Instruct", "--max-model-len", "8192"]
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]

  # Try everything without a GPU: replace `vllm` with this mock.
  # mock-vllm:
  #   build: .
  #   command: ["mockvllm", "--host", "0.0.0.0", "--port", "8000", "--model", "Qwen/Qwen2.5-7B-Instruct"]

volumes:
  llmgate-data:
